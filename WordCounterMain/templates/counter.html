<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Word Count Result</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .result-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .count {
            font-size: 48px;
            font-weight: bold;
            color: #185a9d;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: #185a9d;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #0f3f6d;
        }
    </style>
</head>

<body>

<div class="result-box">
    <h1>Total Number of Words</h1>
    <div class="count">{{ word_count }}</div>

    <a href="/">Count Again</a>
</div>

</body>
</html>
