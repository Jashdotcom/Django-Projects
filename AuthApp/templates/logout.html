<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logged Out | Auth App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            height:100vh;
            background:linear-gradient(135deg, #667eea, #764ba2);
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .logout-box{
            background:white;
            padding:30px;
            width:100%;
            max-width:400px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 15px 30px rgba(0,0,0,0.2);
        }

        .logout-box h2{
            color:#333;
            margin-bottom:10px;
        }

        .logout-box p{
            color:#555;
            font-size:14px;
            margin-bottom:20px;
        }

        .btn{
            display:inline-block;
            padding:10px 20px;
            border-radius:6px;
            text-decoration:none;
            font-size:14px;
            margin:5px;
            transition:0.3s;
        }

        .login-btn{
            background:#667eea;
            color:white;
        }

        .login-btn:hover{
            background:#5a67d8;
        }

        .home-btn{
            background:#e0e0e0;
            color:#333;
        }

        .home-btn:hover{
            background:#d5d5d5;
        }
    </style>
</head>

<body>

<div class="logout-box">
    <h2>You’re logged out 👋</h2>
    <p>Your session has ended successfully.</p>

    <a href="#" class="btn login-btn">Login Again</a>
    <a href="#" class="btn home-btn">Go to Home</a>
</div>

</body>
</html>
